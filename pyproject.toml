[project]
name = "bookworm"
version = "0.1.0"
description = "Book cover generation API for German trade book formats"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "anthropic>=0.40",
    "fonttools>=4.55",
    "cairosvg>=2.7",
    "pillow>=11.0",
    "numpy>=2.1",
    "python-dotenv>=1.0",
    "uharfbuzz>=0.56.2",
    "openai>=3.20.0",
    "pymongo>=4.10",
    "python-multipart>=0.0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "pytest-asyncio>=1.4.0",
    "mongomock>=4.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/covers", "src/books", "src/bookworm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
